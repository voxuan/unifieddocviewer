server:
  port: 0

spring:
  application:
    name: unified-document-viewer-test
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:${wiremock.server.port:8989}/.well-known/jwks.json

external-systems:
  cache-ttl-seconds: 60
  cleanup-cron: "-"
  systems:
    sales:
      enabled: true
      source-name: SALES
      base-url: http://localhost:${wiremock.server.port:8989}
      timeout-ms: 2000
      token-uri: http://localhost:${wiremock.server.port:8989}/token
      client-id: test-client-id
      client-secret: test-client-secret
      scope: sales:documents:read
    service:
      enabled: true
      source-name: SERVICE
      base-url: http://localhost:${wiremock.server.port:8989}
      timeout-ms: 2000
      token-uri: http://localhost:${wiremock.server.port:8989}/token
      client-id: test-client-id
      client-secret: test-client-secret
      scope: service:documents:read

resilience4j:
  circuitbreaker:
    instances:
      sales:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 2s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
      service:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 2s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      sales:
        timeoutDuration: 1s
      service:
        timeoutDuration: 1s
  retry:
    instances:
      sales:
        maxAttempts: 1
      service:
        maxAttempts: 1
